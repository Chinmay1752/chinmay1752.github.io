# Builds the site and publishes it on GitHub Pages.
#
# The docs come from the fels repo, so the site is rebuilt when this repo changes, once a day,
# and on demand (Actions → Deploy → Run workflow) after the docs changed. The std reference is
# made by `fels doc` of the nightly build, which follows fels's main branch.

name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: fels-lang/fels
          path: fels
          sparse-checkout: |
            docs
            lib/std
      - name: Get the nightly fels
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download nightly -R fels-lang/fels -p "fels-[0-9]*-x86_64-windows.zip" -D nightly
          Expand-Archive (Get-ChildItem nightly/*.zip)[0] -DestinationPath nightly
          $exe = (Get-ChildItem nightly -Recurse -Filter fels.exe)[0].FullName
          "FELS=$exe" >> $env:GITHUB_ENV
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          FELS_DOCS: fels/docs
          FELS_STD: fels/lib/std
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
